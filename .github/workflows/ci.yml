name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_VERSION: "9.14.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}

      - name: Cache cabal
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('agda-lint.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test

  # the action in project mode, with the example rules built against this checkout
  action:
    name: action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Lint fixtures
        uses: ./
        with:
          project: test/action
          args: test/fixtures/crossfile
          fail-on: never
          ghc-version: ${{ env.GHC_VERSION }}

      - name: Check the linter it built
        run: |
          agda-lint --list-rules | grep lemmaPrefix
          code=0
          agda-lint test/fixtures/core > report.txt || code=$?
          cat report.txt
          test "$code" -eq 1
          grep -q asciiArrow report.txt
